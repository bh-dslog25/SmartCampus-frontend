server {
    listen 80;
    server_name localhost;

    # Docker internal DNS resolver with 5s cache
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve static assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy REST API sang AI Service & Central Backend
    location /api/ {
        set $upstream_ai http://smartcampus-ai:8000;
        proxy_pass $upstream_ai$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy WebSocket Realtime Tunnel (/ws/campus)
    location /ws/ {
        set $upstream_ai http://smartcampus-ai:8000;
        proxy_pass $upstream_ai$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
