services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcampus-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      - ai-agent
    networks:
      - smartcampus-net

networks:
  smartcampus-net:
    name: smartcampus-network
    driver: bridge
